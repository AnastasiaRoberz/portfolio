<div class="reference-card">
    <div class="reference-card__content">
        @if (responsive.isDesktop()) {
            <svg class="reference-card__icon-quote">
                <use href="assets/icons/icons.svg#icon-quote"></use>
            </svg>
        }

        <p class="reference-card__text">{{ references[currentId].text | translate }}</p>
        <div class="reference-card__name-row">
            <p class="reference-card__name">
                {{ references[currentId].name }} - {{ references[currentId].role | translate }}
            </p>
        </div>
    </div>
    <div class="reference-card__photo">
        <div class="photo-mask">
            <img
                src="./assets/pngs/references/{{ references[currentId].img }}"
                alt=""
                [style.object-position]="references[currentId].position"
                [style.scale]="references[currentId].scale"
            />
        </div>
    </div>
</div>

<div class="ref-control">
    <button class="btn btn--arrow" (click)="prev()" [disabled]="currentId == 0">
        <svg class="icon">
            <use href="./assets/icons/icons.svg#icon-arrow-back"></use>
        </svg>
    </button>

    <div class="ref-control__dots-wrapper">
        @for (item of references; track $index) {
            <button
                class="ref-control__dot"
                [class.active]="currentId === $index"
                (click)="goTo($index)"
            ></button>
        }
    </div>

    <button class="btn btn--arrow" (click)="next()" [disabled]="currentId == references.length - 1">
        <svg class="icon">
            <use href="./assets/icons/icons.svg#icon-arrow-forward"></use>
        </svg>
    </button>
</div>
