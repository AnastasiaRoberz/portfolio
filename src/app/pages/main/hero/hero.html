<div class="hero-content">
    <div class="hero-title">
        <p class="vertical">I am</p>
        <div class="name-wrapper">
            <h1 class="name">
                Anastasia <br />
                Roberz
            </h1>
            <p class="job-title">{{ 'hero.job-title' | translate }}</p>
        </div>
    </div>

    <a class="btn btn-primary" href="#contact">{{ 'hero.btn-talk' | translate }}</a>
</div>

<div class="hero-footer">
    <app-social-links />

    @if (responsive.isDesktop()) {
        <p class="scroll">
            {{ 'hero.scroll' | translate }}
            <span>
                <svg class="arrow-down">
                    <use href="./assets/icons/icons.svg#icon-arrow-down"></use>
                </svg>
            </span>
        </p>
    }
</div>
