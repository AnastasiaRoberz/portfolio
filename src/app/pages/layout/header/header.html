<div class="header-content">
    <a class="logo" routerLink="/" (click)="scrollService.scrollToTop()">
        <img class="logo" src="./assets/icons/logo.svg" alt="" />
    </a>

    @if (!breakpoint()) {
        <div class="menu">
            <nav>
                <button
                    class="btn btn--text"
                    [class.active]="scrollService.activeSection() === 'about'"
                    (click)="scrollService.scrollTo('about')"
                >
                    {{ 'header.about' | translate }}
                </button>
                <button
                    class="btn btn--text"
                    [class.active]="scrollService.activeSection() === 'skills'"
                    (click)="scrollService.scrollTo('skills')"
                >
                    {{ 'header.skills' | translate }}
                </button>
                <button
                    class="btn btn--text"
                    [class.active]="scrollService.activeSection() === 'portfolio'"
                    (click)="scrollService.scrollTo('portfolio')"
                >
                    {{ 'header.portfolio' | translate }}
                </button>
            </nav>

            <div class="language-switch">
                <button
                    type="button"
                    class="btn btn--lang"
                    (click)="useLanguage('de')"
                    [class.active]="currentLanguage === 'de'"
                    data-text="DE"
                >
                    DE
                </button>
                <button
                    type="button"
                    class="btn btn--lang"
                    (click)="useLanguage('en')"
                    [class.active]="currentLanguage === 'en'"
                    data-text="EN"
                >
                    EN
                </button>
            </div>
        </div>
    } @else {
        <button
            type="button"
            class="btn-burger-menu"
            (click)="toggleMenu()"
            [class.open]="isMenuOpen()"
        >
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
        </button>

        <div class="mobile-menu" [class.active]="isMenuOpen()">
            <a
                [class.active]="scrollService.activeSection() === 'about'"
                (click)="scrollMobile('about')"
                >About me</a
            >
            <a
                [class.active]="scrollService.activeSection() === 'skills'"
                (click)="scrollMobile('skills')"
                >Skills</a
            >
            <a
                [class.active]="scrollService.activeSection() === 'portfolio'"
                (click)="scrollMobile('portfolio')"
                >Portfolio</a
            >
            <a
                [class.active]="scrollService.activeSection() === 'contact'"
                (click)="scrollMobile('contact')"
                >Contact</a
            >
            <div class="mobile-language-wrapper">
                <button
                    type="button"
                    (click)="useLanguage('en')"
                    [class.active]="currentLanguage === 'en'"
                    class="btn-mobile-language"
                >
                    EN
                </button>
                <span> / </span>
                <button
                    type="button"
                    (click)="useLanguage('de')"
                    [class.active]="currentLanguage === 'de'"
                    class="btn-mobile-language"
                >
                    DE
                </button>
            </div>
        </div>
    }
</div>
